# Doppel brand registry. Format: contracts/registry.schema.json (v1.1).
#
# Filled in P1 (2026-11-05). Every genuine_family entry records WHERE it was
# confirmed (source: the brand's own page, an exchange filing, or IANA) and WHEN.
# verified_on: null means "still to verify": the entry is used, but the Family
# Verifier reports it as unverified.
#
# How entries were verified (reproduce with scripts/data/verify_registry.py):
# 1. The domain is named or linked on the brand's own official page, an
#    exchange filing, or the IANA root zone database.
# 2. It resolves in DNS (2026-11-05), and legacy addresses redirect to the new one.
#
# Domains are lowercase ASCII (punycode for IDNs).

schema_version: 1
updated: 2026-11-06

restricted_registries:
  - suffix: bank.in
    who_can_register: Banks verified by IDRBT, the exclusive registrar under RBI's April 2025 circular (migration deadline 31 Oct 2025)
    source: https://www.businesstoday.in/amp/personal-finance/banking/story/rbi-mandates-banks-to-adopt-bankin-domains-for-safer-digital-access-check-faqs-473150-2025-04-22
    verified_on: 2026-11-04
  - suffix: fin.in
    who_can_register: Non-bank financial entities (announced by RBI in Feb 2025; no launch date found, and no fin.in names in our NRD snapshot)
    source: https://en.wikipedia.org/wiki/.in
    verified_on: 2026-11-05
  - suffix: gov.in
    who_can_register: Government ministries, departments, states and union territories; NIC is the only registrar (secondary source; registry.gov.in renders by script)
    source: https://en.wikipedia.org/wiki/.in
    verified_on: 2026-11-05
  - suffix: nic.in
    who_can_register: Reserved for the National Informatics Centre, which hosts many government sites (secondary source)
    source: https://en.wikipedia.org/wiki/.in
    verified_on: 2026-11-05

# Closed brand TLDs (proof a), as listed in the IANA root zone database.
brand_tld_registry:
  - { tld: sbi, brand: sbi, manager: State Bank of India, source: "https://www.iana.org/domains/root/db/sbi.html", verified_on: 2026-11-05 }
  - { tld: hdfcbank, brand: hdfc, manager: HDFC Bank Limited, source: "https://www.iana.org/domains/root/db/hdfcbank.html", verified_on: 2026-11-05 }
  - tld: hdfc
    brand: hdfc
    manager: Housing Development Finance Corporation Limited
    source: https://www.iana.org/domains/root/db/hdfc.html
    verified_on: null
    note: IANA still lists HDFC Ltd, which merged into HDFC Bank in 2023. Confirm HDFC Bank now controls .hdfc before relying on it.
  - { tld: google, brand: google, manager: Charleston Road Registry Inc. (Google), source: "https://www.iana.org/domains/root/db/google.html", verified_on: 2026-11-05 }
  - { tld: goog, brand: google, manager: Charleston Road Registry Inc. (Google), source: "https://www.iana.org/domains/root/db/goog.html", verified_on: 2026-11-05 }
  - { tld: gmail, brand: google, manager: Charleston Road Registry Inc. (Google), source: "https://www.iana.org/domains/root/db/gmail.html", verified_on: 2026-11-05 }

