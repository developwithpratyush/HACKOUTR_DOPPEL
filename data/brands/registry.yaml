  # ------------------------------------------------------------ NPCI / UPI ---
  # Added in P11 (optional 9th brand, docs/finale-examples.md 2.3). Only npci.org.in is listed by hand:
  # family auto-discovery proves bhimupi.org.in, rupay.co.in, netc.org.in and upichalega.com from NPCI's
  # own certificate (data/brands/discovered.yaml).
  - id: npci
    name: NPCI / UPI
